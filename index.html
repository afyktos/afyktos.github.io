<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Afyktos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@300;400;500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="landing-shell">
    <section class="landing-center" aria-label="Afyktos portfolio selection">
      <img class="main-logo" src="assets/afyktos-logo.png" alt="Afyktos" />

      <nav class="choice-nav" aria-label="Portfolio sections">
        <a class="choice" href="/music/">
          <span class="choice-title">MUSIC</span>
          <span class="choice-sub">PRODUCTION</span>
        </a>

        <span class="divider" aria-hidden="true"></span>

        <a class="choice" href="/art/">
          <span class="choice-title">ART &amp; DESIGN</span>
          <span class="choice-sub">VISUAL DIRECTION</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
